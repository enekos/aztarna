name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14 # cross-compiled from arm64 — Intel runners queue slowly
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          staging="aztarna-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/aztarna" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
          else
            shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aztarna-${{ matrix.target }}
          path: |
            aztarna-${{ matrix.target }}.tar.gz
            aztarna-${{ matrix.target }}.tar.gz.sha256

  packages:
    name: Linux packages ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    env:
      NFPM_VERSION: 2.47.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: aztarna-*${{ matrix.target }}
          path: artifact
          merge-multiple: true

      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.deb "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i nfpm.deb

      - name: Build deb, rpm and apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pkg packages
          tar -xzf artifact/*.tar.gz -C dist/pkg --strip-components=1
          case "$GITHUB_REF_NAME" in v*) VERSION="${GITHUB_REF_NAME#v}" ;; *) VERSION=0.0.0 ;; esac
          export VERSION ARCH="${{ matrix.arch }}"
          for format in deb rpm apk; do
            nfpm package --config nfpm.yaml --packager "$format" --target packages/
          done
          cd packages
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: packages/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
